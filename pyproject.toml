[project]
name = "restaurant-booking-df2-diplom"
version = "0.1.0"
description = ""
authors = [
    {name = "Olesia Laskovets",email = "olesya_izvarina@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django (>=6.1,<6.2)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 88
target-version = ["py314"]
exclude = '''
/(
    \.git
  | \.venv
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]
